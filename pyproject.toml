[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-web"
# Single source of truth for the version — bump it here and nowhere else.
version = "1.0.0"
description = "Web UI for managing Claude Code sessions, memory, skills, and projects"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "croniter>=2.0",
    "mcp>=1.27,<2",
]

[project.scripts]
claude-web = "server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Provides the aiohttp_client fixture every route test uses. (aiohttp has no
    # 'testing' extra — declaring aiohttp[testing] installs nothing extra.)
    "pytest-aiohttp>=1.1",
]

[tool.setuptools.packages.find]
include = ["server*"]

# The built frontend (copied to server/static by frontend's `npm run postbuild`)
# ships as package data so the server serves the UI with no Node present.
[tool.setuptools.package-data]
server = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

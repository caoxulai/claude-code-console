[project]
name = "claude-web"
version = "0.2.0"
description = "Web UI for managing Claude Code sessions, memory, skills, and projects"
requires-python = ">=3.10"
# scripts (console entry points) and dependencies are declared in setup.py so
# the same metadata drives both `pip install .` and the Brazil build.
dynamic = ["scripts", "dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp[testing]",
]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.setuptools.package-data]
server = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
